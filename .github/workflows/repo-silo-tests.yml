name: Silo Compatibility
on:
  workflow_dispatch:
  schedule: ## Run at 00:08 UTC on Mondays and Thursdays.
    - cron: '8 0 * * Mon,Thu'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      - name: Run Silo Repository tests
        run: ./gradlew -PintegrationTests=silo check --rerun-tasks
