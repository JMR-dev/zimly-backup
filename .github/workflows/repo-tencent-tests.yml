name: Tencent Compatibility
on:
  workflow_dispatch:
  schedule: ## Run at 00:08 UTC on Sundays.
    - cron: '8 0 * * Sun'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      - name: Run AWS Repository tests
        env:
          TENCENT_KEY: ${{ secrets.TENCENT_KEY }}
          TENCENT_SECRET: ${{ secrets.TENCENT_SECRET }}
        run: ./gradlew -PintegrationTests=tencent check --rerun-tasks
