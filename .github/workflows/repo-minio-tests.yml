name: Minio Compatibility
on:
  workflow_dispatch:
  schedule: ## Run at 00:08 UTC on Mondays and Thursdays.
    - cron: '8 0 * * Mon,Thu'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      - name: Run Minio Repository tests
        run: ./gradlew -PintegrationTests=minio check --rerun-tasks